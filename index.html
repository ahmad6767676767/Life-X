<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Zombie Survival Starter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* HUD overlay */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      text-shadow: 1px 1px 3px black;
      font-weight: bold;
    }
    .bar-container {
      width: 200px;
      height: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid white;
      margin-bottom: 5px;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 100%;
      transition: width 0.2s;
    }
    #health-bar { background: #e74c3c; }
    #food-bar { background: #e67e22; }
    #water-bar { background: #3498db; }
    
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <!-- Load Three.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Load PointerLockControls for FPS navigation -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Heads Up Display (HUD) -->
  <div id="hud">
    <div>HEALTH</div>
    <div class="bar-container"><div id="health-bar" class="bar"></div></div>
    <div>FOOD</div>
    <div class="bar-container"><div id="food-bar" class="bar"></div></div>
    <div>WATER</div>
    <div class="bar-container"><div id="water-bar" class="bar"></div></div>
  </div>

  <div id="instructions">
    <h1>CLICK TO PLAY</h1>
    <p>Move: WASD<br>Look: Mouse</p>
  </div>

  <script>
    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122); // Foggy night sky
    scene.fog = new THREE.FogExp2(0x111122, 0.03);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0x333355, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x9999bb, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // 3. Ground / World Generation
    const groundGeometry = new THREE.PlaneGeometry(200, 200);
    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x223322 });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Simple building generator
    function createBuilding(x, z) {
      const geometry = new THREE.BoxGeometry(10, 8, 10);
      const material = new THREE.MeshStandardMaterial({ color: 0x555555 });
      const building = new THREE.Mesh(geometry, material);
      building.position.set(x, 4, z);
      scene.add(building);
    }

    createBuilding(-20, -20);
    createBuilding(20, -30);
    createBuilding(-10, 30);

    // 4. Controls & Movement
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');

    instructions.addEventListener('click', () => {
      controls.lock();
    });

    controls.addEventListener('lock', () => {
      instructions.style.display = 'none';
    });

    controls.addEventListener('unlock', () => {
      instructions.style.display = 'block';
    });

    scene.add(controls.getObject());
    controls.getObject().position.set(0, 2, 0);

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    const onKeyDown = (event) => {
      switch (event.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyD': moveRight = true; break;
      }
    };

    const onKeyUp = (event) => {
      switch (event.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyD': moveRight = false; break;
      }
    };

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    // 5. Game Loop
    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      if (controls.isLocked) {
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
